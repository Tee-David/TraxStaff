name: Build Desktop App

# Builds the Trax desktop tracker for every platform we ship.
# - Push to main/dev/staging (touching desktop) → downloadable artifacts.
# - Version tag (v*) → GitHub Release with signed installers + a merged
#   latest.json covering all platforms (auto-updater).
# - Manual via workflow_dispatch.
on:
  push:
    branches: [main, dev, staging]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Windows is what ships today; a Linux regression must not stop its build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundle: nsis
            installer: "*-setup.exe"
          # Pinned deliberately: an AppImage is only as portable as the glibc it
          # was linked against, so drifting to a newer runner would silently
          # raise the minimum supported distro.
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundle: appimage
            installer: "*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the untagged-build version is derived from the
          # most recent tag via `git describe`, which sees nothing in a shallow
          # clone and would silently fall back to 0.0.0.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # webkit2gtk/soup are Tauri's webview; the X11 libs are what rdev links
      # against for global input sampling; librsvg + patchelf are needed to
      # assemble the AppImage.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev libxi-dev libxtst-dev libxdo-dev \
            build-essential file patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Every build gets a version, not just tags. An untagged artifact left at
      # the checked-in 0.1.0 sits *below* the published release in latest.json,
      # so the updater installs that older release over it and loops. Untagged
      # builds therefore get a prerelease suffix that sorts ABOVE the last tag.
      - name: Sync app version
        shell: bash
        working-directory: desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            LAST="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            LAST="${LAST#v}"
            # bump patch, then mark as a dev build of that upcoming version
            VER="$(echo "$LAST" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')-dev.${GITHUB_RUN_NUMBER}"
          fi
          node -e "const fs=require('fs');for(const f of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(f));j.version='$VER';fs.writeFileSync(f,JSON.stringify(j,null,2));}"
          echo "app version set to $VER"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (signed)
        working-directory: desktop
        run: npm run tauri build
        env:
          VITE_BACKEND_URL: https://trax-backend-ocaq.onrender.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # The updater fetches ONE latest.json, so no single job can write it.
      # Each platform emits its own fragment and the release job merges them.
      - name: Emit updater manifest fragment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          node -e "
          const fs=require('fs'), path=require('path');
          const dir=path.join('src-tauri/target/release/bundle','${{ matrix.bundle }}');
          const files=fs.readdirSync(dir);
          const sig=files.find(f=>f.endsWith('.sig'));
          const art=files.find(f=>!f.endsWith('.sig'));
          if(!art||!sig){console.error('missing artifact/sig in '+dir,files);process.exit(1);}
          fs.writeFileSync('fragment-${{ matrix.platform }}.json',JSON.stringify({
            '${{ matrix.platform }}':{
              signature:fs.readFileSync(path.join(dir,sig),'utf8').trim(),
              url:'https://github.com/Tee-David/trax/releases/download/'+process.env.GITHUB_REF_NAME+'/'+art,
            }
          },null,2));
          "

      # Collect into one flat directory before uploading. upload-artifact keeps
      # paths relative to the least-common ancestor of everything it is given,
      # and that ancestor was `desktop/` — so the download unpacked as
      # src-tauri/target/release/bundle/nsis/<installer>, eight folders deep for
      # a single file. Uploading a directory instead puts its contents at the
      # root of the zip.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          find desktop/src-tauri/target/release/bundle \
            -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          # The fragment only exists on a tag push (see "Emit updater manifest
          # fragment" above, gated the same way) — a plain branch push has
          # nothing to copy here, and that must not fail the whole step.
          if [ -f "desktop/fragment-${{ matrix.platform }}.json" ]; then
            cp "desktop/fragment-${{ matrix.platform }}.json" dist/
          fi
          # An empty dist means the bundle layout moved; fail here rather than
          # publishing a release with a missing platform.
          if [ -z "$(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print -quit)" ]; then
            echo "::error::no installer found under desktop/src-tauri/target/release/bundle"
            exit 1
          fi
          ls -la dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: trax-${{ matrix.platform }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    # Only after every platform has built, so a release never ships a
    # latest.json advertising a platform whose artifact is missing.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge updater manifests
        run: |
          node -e "
          const fs=require('fs');
          const frags=require('child_process').execSync('find artifacts -name \"fragment-*.json\"').toString().trim().split('\n').filter(Boolean);
          if(!frags.length){console.error('no manifest fragments');process.exit(1);}
          const platforms=Object.assign({},...frags.map(f=>JSON.parse(fs.readFileSync(f))));
          const manifest={version:process.env.GITHUB_REF_NAME.replace(/^v/,''),notes:'Trax '+process.env.GITHUB_REF_NAME,pub_date:new Date().toISOString(),platforms};
          fs.writeFileSync('latest.json',JSON.stringify(manifest,null,2));
          console.log(manifest);
          "

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            latest.json
