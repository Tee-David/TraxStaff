name: Build Windows App

# Builds the Trax desktop tracker into a Windows installer in the cloud.
# - Push to main/dev/staging (touching desktop) → downloadable artifact.
# - Version tag (v*) → GitHub Release with signed installer + latest.json (auto-updater).
# - Manual via workflow_dispatch.
on:
  push:
    branches: [main, dev, staging]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # create/attach the GitHub Release on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');for(const f of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(f));j.version='$VER';fs.writeFileSync(f,JSON.stringify(j,null,2));}"
          echo "app version set to $VER"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (signed Windows installer)
        working-directory: desktop
        run: npm run tauri build
        env:
          VITE_BACKEND_URL: https://trax-backend-ocaq.onrender.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          node -e "
          const fs=require('fs');
          const dir='src-tauri/target/release/bundle/nsis';
          const files=fs.readdirSync(dir);
          const exe=files.find(f=>f.endsWith('-setup.exe'));
          const sig=files.find(f=>f.endsWith('-setup.exe.sig'));
          if(!exe||!sig){console.error('missing exe/sig',files);process.exit(1);}
          const ver=require('./src-tauri/tauri.conf.json').version;
          const manifest={version:ver,notes:'Trax '+process.env.GITHUB_REF_NAME,pub_date:new Date().toISOString(),platforms:{'windows-x86_64':{signature:fs.readFileSync(dir+'/'+sig,'utf8').trim(),url:'https://github.com/Tee-David/trax/releases/download/'+process.env.GITHUB_REF_NAME+'/'+exe}}};
          fs.writeFileSync('latest.json',JSON.stringify(manifest,null,2));
          console.log(manifest);
          "

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: trax-windows-installer-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer + updater manifest to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/latest.json
