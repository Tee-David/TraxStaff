name: Build Windows App

# Builds the Trax desktop tracker into a Windows installer in the cloud.
# - Every push to main (that touches the desktop app) → downloadable artifact.
# - Every version tag (v*) → a GitHub Release with the installer attached.
# - Manually via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app (Windows installer)
        working-directory: desktop
        # beforeBuildCommand in tauri.conf.json builds the Vite frontend first,
        # then Cargo compiles the Rust core and bundles the NSIS installer.
        run: npm run tauri build
        env:
          # Point the shipped app at the production backend.
          VITE_BACKEND_URL: https://trax-backend-ocaq.onrender.com

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: trax-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach installer to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
