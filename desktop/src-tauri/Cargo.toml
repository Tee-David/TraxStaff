[package]
name = "trax-desktop"
version = "0.1.0"
description = "Trax time tracker"
authors = ["Trax"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trax_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
