[package]
name = "trax-desktop"
version = "0.1.0"
description = "Trax time tracker"
authors = ["Trax"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trax_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"                       # focus the running tracker instead of spawning a second one
tauri-plugin-notification = "2"                          # idle/not-tracking reminders
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# --- native capture (activity sampling + screenshots + sync) ---
rdev = "0.5"                                              # global input-intensity sampling (counts/timing only, NOT content)
xcap = "0.0"                                              # all-monitor screenshot capture (Win/X11/Wayland/macOS)
webp = "0.3"                                              # lossy WebP encode — smaller than JPEG/PNG for R2
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"                                             # hash-chain (byte-identical to backend)
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sysinfo = "0.32"                                          # mouse-jiggler process blocklist check
active-win-pos-rs = "0.8"                                 # foreground app usage sampling
once_cell = "1"
base64 = "0.22"                                          # inline data: URLs for the local screenshot gallery

# Windows-only: OS idle time (GetLastInputInfo) + browser URL sampling (UI Automation).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
